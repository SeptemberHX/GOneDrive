# Gitea Actions — staged CI/CD for GOnedrive.
#
# The jobs are deliberately separate so a failure is visible at the right
# stage and a later stage can be retried without rerunning unrelated work:
#   lint -> test -> build -> release (tag pushes only)
#
# Prerequisites on the Gitea instance:
#   1. A registered act_runner with the `ubuntu-latest` label and Docker
#      support (jobs run inside an ubuntu:25.04 container).
#   2. Optional: an Actions variable GONEDRIVE_CLIENT_ID containing the Entra
#      app id (a secret with the same name is also accepted). It is baked into
#      the package; without it users must configure client_id locally.
name: CI / CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  # -----------------------------------------------------------------------
  # Stage 1: source formatting and compiler lints.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    container:
      # Ubuntu 25.04 is the minimum supported GTK/libadwaita build base.
      image: ubuntu:25.04
    steps:
      # The container is intentionally minimal and has no Node. Install it
      # before checkout because checkout/cache are JavaScript actions.
      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libgtk-4-dev libadwaita-1-dev nodejs

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy

      - name: Cache cargo + target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-lint-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # -----------------------------------------------------------------------
  # Stage 2: Rust and extension tests. It does not depend on a client id.
  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libgtk-4-dev libadwaita-1-dev nodejs python3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo + target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-test-

      - name: Rust tests
        run: cargo test --workspace --all-targets

      - name: Nautilus extension tests
        run: python3 -m unittest discover -s data/nautilus/tests -v

  # -----------------------------------------------------------------------
  # Stage 3: produce the Debian package. The client id is resolved only in
  # this job, so it never needs to cross an artifact or be printed by CI.
  build:
    name: Build .deb
    needs: test
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - name: Install system dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libgtk-4-dev libadwaita-1-dev nodejs dpkg-dev jq

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo + target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-build-

      # An Entra application id is public configuration, so an Actions
      # variable is preferred. Keep accepting the old secret setting for
      # existing repositories and installations.
      - name: Resolve Entra client id
        env:
          CLIENT_ID_VARIABLE: ${{ vars.GONEDRIVE_CLIENT_ID }}
          CLIENT_ID_SECRET: ${{ secrets.GONEDRIVE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_ID_VARIABLE:-}" ]; then
            printf 'GONEDRIVE_CLIENT_ID=%s\n' "$CLIENT_ID_VARIABLE" >> "$GITHUB_ENV"
            echo "Using GONEDRIVE_CLIENT_ID from the Actions variable (value hidden)."
          elif [ -n "${CLIENT_ID_SECRET:-}" ]; then
            printf 'GONEDRIVE_CLIENT_ID=%s\n' "$CLIENT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using GONEDRIVE_CLIENT_ID from the Actions secret (value hidden)."
          else
            echo "::warning::GONEDRIVE_CLIENT_ID is not configured; the package will require per-user client_id configuration."
          fi

      - name: Build .deb
        run: ./build-deb.sh

      - name: Verify package
        run: |
          set -euo pipefail
          deb=$(find . -maxdepth 1 -type f -name 'gonedrive_*.deb' -print -quit)
          test -n "$deb"
          dpkg-deb --info "$deb" >/dev/null
          contents=$(mktemp)
          dpkg-deb --contents "$deb" > "$contents"
          grep -q '/usr/bin/gonedrived$' "$contents"
          grep -q '/usr/bin/gonedrive-hsm$' "$contents"
          sha256sum "$deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v3
        with:
          name: gonedrive-deb
          path: gonedrive_*.deb
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # Stage 4: publish only a tagged build. The package comes from the build
  # stage; this job never recompiles source or resolves credentials.
  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.04
    steps:
      - name: Install release tools
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            nodejs curl ca-certificates jq

      - name: Download package artifact
        uses: actions/download-artifact@v3
        with:
          name: gonedrive-deb
          path: dist

      - name: Publish Gitea Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deb=$(find dist -type f -name 'gonedrive_*.deb' -print -quit)
          test -n "$deb"
          echo "Releasing $(basename "$deb") as $TAG"

          # Create the release, or reuse it if the tag was released before.
          rid=$(curl -sf -X POST "$API/releases" \
                 -H "Authorization: token $TOKEN" \
                 -H "Content-Type: application/json" \
                 -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" \
                 | jq -r '.id') || true
          if [ -z "${rid:-}" ] || [ "$rid" = "null" ]; then
            rid=$(curl -sf "$API/releases/tags/$TAG" \
                   -H "Authorization: token $TOKEN" | jq -r '.id')
          fi
          test -n "$rid" && test "$rid" != "null"
          curl -sf -X POST "$API/releases/$rid/assets?name=$(basename "$deb")" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$deb;type=application/vnd.debian.binary-package" \
            >/dev/null
          echo "Attached $(basename "$deb") to release $TAG (id $rid)"
