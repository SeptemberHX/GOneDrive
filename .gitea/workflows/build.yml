# Gitea Actions — build, test and package GOnedrive into a .deb.
#
# Prerequisites on your Gitea instance:
#   1. A registered act_runner with the `ubuntu-latest` label and Docker
#      support (this job runs inside an ubuntu:25.04 container).
#   2. A repository (or org) secret GONEDRIVE_CLIENT_ID = your Entra app id.
#      It is baked into the binaries at build time; without it the package
#      builds but cannot sign in.
#
# On every push/PR the .deb is attached as a build artifact. Pushing a tag
# like `v0.1.0` additionally creates a Gitea Release and uploads the .deb to
# it (using the auto-provided GITHUB_TOKEN, no extra secret needed).
name: Build & package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ubuntu:25.04 ships GTK 4.18 / libadwaita 1.7 — the floor the code targets
    # (features v4_18 / v1_7). Binaries built here also run on newer GTK
    # (e.g. 26.04's 4.22). Bump this tag to move the build base forward.
    container:
      image: ubuntu:25.04
    steps:
      - name: Install system build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libgtk-4-dev libadwaita-1-dev \
            dpkg-dev jq

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --component rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache cargo + target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-

      # --- quality gates -------------------------------------------------
      # fmt and clippy are advisory here (continue-on-error) so a style nit
      # never blocks a package. Flip them to hard gates by removing the line.
      - name: Format check
        continue-on-error: true
        run: cargo fmt --all --check

      - name: Clippy
        continue-on-error: true
        env:
          GONEDRIVE_CLIENT_ID: ${{ secrets.GONEDRIVE_CLIENT_ID }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Tests are advisory only because several exercise user.* xattrs, which
      # some container filesystems (overlayfs) do not support — a false red
      # unrelated to the code. Once your runner's fs supports user xattrs,
      # drop continue-on-error to make tests a hard gate.
      - name: Test
        continue-on-error: true
        env:
          GONEDRIVE_CLIENT_ID: ${{ secrets.GONEDRIVE_CLIENT_ID }}
        run: cargo test --workspace

      # --- the actual deliverable ---------------------------------------
      - name: Build .deb
        env:
          GONEDRIVE_CLIENT_ID: ${{ secrets.GONEDRIVE_CLIENT_ID }}
        run: ./build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v3
        with:
          name: gonedrive-deb
          path: gonedrive_*.deb
          if-no-files-found: error

      # --- release on tag ------------------------------------------------
      - name: Publish Gitea Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deb=$(ls gonedrive_*.deb | head -1)
          echo "Releasing $deb as $TAG"
          # Create the release, or reuse it if the tag was released before.
          rid=$(curl -sf -X POST "$API/releases" \
                 -H "Authorization: token $TOKEN" \
                 -H "Content-Type: application/json" \
                 -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" \
                 | jq -r '.id') || true
          if [ -z "${rid:-}" ] || [ "$rid" = "null" ]; then
            rid=$(curl -sf "$API/releases/tags/$TAG" \
                   -H "Authorization: token $TOKEN" | jq -r '.id')
          fi
          curl -sf -X POST "$API/releases/$rid/assets?name=$(basename "$deb")" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$deb;type=application/vnd.debian.binary-package" >/dev/null
          echo "Attached $deb to release $TAG (id $rid)"
