# Gitea Actions — build, test and package GOnedrive into a .deb.
#
# Prerequisites on your Gitea instance:
#   1. A registered act_runner with the `ubuntu-latest` label and Docker
#      support (this job runs inside an ubuntu:25.04 container).
#   2. Optional: an Actions variable GONEDRIVE_CLIENT_ID containing your Entra
#      app id (a secret with the same name is also accepted for compatibility).
#      It is baked into the binaries; without it the package still builds, but
#      users must configure a client_id before signing in.
#
# On every push/PR the .deb is attached as a build artifact. Pushing a tag
# like `v0.1.0` additionally creates a Gitea Release and uploads the .deb to
# it (using the auto-provided GITHUB_TOKEN, no extra secret needed).
name: Build & package

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ubuntu:25.04 ships GTK 4.18 / libadwaita 1.7 — the floor the code targets
    # (features v4_18 / v1_7). Binaries built here also run on newer GTK
    # (e.g. 26.04's 4.22). Bump this tag to move the build base forward.
    container:
      image: ubuntu:25.04
    steps:
      # This runs before actions/checkout on purpose: it is a plain shell step
      # (needs no Node), and it installs the Node that the JavaScript-based
      # actions below (checkout, cache, upload-artifact) require. ubuntu:25.04
      # is a minimal image with no Node, so without this checkout fails with
      # "node: command not found" (exit 127) — nektos/act issue #107.
      - name: Install system build dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git curl ca-certificates \
            libgtk-4-dev libadwaita-1-dev \
            nodejs \
            dpkg-dev jq

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable + rustfmt + clippy)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          # rustup-init's --component takes one value per flag; add both here,
          # where `rustup component add` accepts several. (cargo/rustup are not
          # yet on PATH this step — GITHUB_PATH applies to later steps — so call
          # rustup by full path.)
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy

      - name: Cache cargo + target
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-

      # An Entra application id is public configuration, so an Actions variable
      # is the natural place for it. Keep accepting the former secret setting so
      # existing installations do not silently lose their baked-in client id.
      - name: Resolve Entra client id
        env:
          CLIENT_ID_VARIABLE: ${{ vars.GONEDRIVE_CLIENT_ID }}
          CLIENT_ID_SECRET: ${{ secrets.GONEDRIVE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLIENT_ID_VARIABLE:-}" ]; then
            printf 'GONEDRIVE_CLIENT_ID=%s\n' "$CLIENT_ID_VARIABLE" >> "$GITHUB_ENV"
            echo "Using GONEDRIVE_CLIENT_ID from the Actions variable (value hidden)."
          elif [ -n "${CLIENT_ID_SECRET:-}" ]; then
            printf 'GONEDRIVE_CLIENT_ID=%s\n' "$CLIENT_ID_SECRET" >> "$GITHUB_ENV"
            echo "Using GONEDRIVE_CLIENT_ID from the Actions secret (value hidden)."
          else
            echo "::warning::GONEDRIVE_CLIENT_ID is not configured; the package will require per-user client_id configuration."
          fi

      # --- quality gates -------------------------------------------------
      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Nautilus extension tests
        run: python3 -m unittest discover -s data/nautilus/tests -v

      # --- the actual deliverable ---------------------------------------
      - name: Build .deb
        run: ./build-deb.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v3
        with:
          name: gonedrive-deb
          path: gonedrive_*.deb
          if-no-files-found: error

      # --- release on tag ------------------------------------------------
      - name: Publish Gitea Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          deb=$(ls gonedrive_*.deb | head -1)
          echo "Releasing $deb as $TAG"
          # Create the release, or reuse it if the tag was released before.
          rid=$(curl -sf -X POST "$API/releases" \
                 -H "Authorization: token $TOKEN" \
                 -H "Content-Type: application/json" \
                 -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"draft\":false,\"prerelease\":false}" \
                 | jq -r '.id') || true
          if [ -z "${rid:-}" ] || [ "$rid" = "null" ]; then
            rid=$(curl -sf "$API/releases/tags/$TAG" \
                   -H "Authorization: token $TOKEN" | jq -r '.id')
          fi
          curl -sf -X POST "$API/releases/$rid/assets?name=$(basename "$deb")" \
            -H "Authorization: token $TOKEN" \
            -F "attachment=@$deb;type=application/vnd.debian.binary-package" >/dev/null
          echo "Attached $deb to release $TAG (id $rid)"
