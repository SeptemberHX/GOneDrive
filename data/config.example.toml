# Copy to ~/.config/gonedrive/config.toml

# Entra ID application (client) id.
#
# Leave this commented out to use whatever was baked into the binary at build
# time (`GONEDRIVE_CLIENT_ID=... cargo build --release`). Set it only to
# override that — for instance if the shared registration starts getting
# throttled and you would rather have your own quota.
#
# It identifies the *application*, not you: you still sign in with your own
# Microsoft account. It is not a secret.
#
# client_id = "your-application-client-id"

# Local folder mirroring the drive root.
sync_root = "/home/YOU/OneDrive"

# Remote delta cadence. Successful polls stay at 30 seconds; only failures back
# off towards the maximum, so remote edits have a predictable delay.
poll_interval_secs = 30
max_poll_interval_secs = 300

# Full local-tree verification. Watcher events drive ordinary incremental
# scans; this catches events missed while the daemon was stopped or overflowed.
full_scan_interval_secs = 1800

# Quiet period a local file must have before it is queued for upload. An
# application saving a document writes it several times in a row; this stops
# three half-written versions being uploaded.
local_debounce_ms = 500

# Files at or above this size use a resumable upload session.
# Graph rejects simple uploads above 4 MiB, so this cannot be raised.
upload_session_threshold = 4194304

# Resumable upload chunk size. Must be a multiple of 320 KiB (327680).
# 10 MiB = 32 x 320 KiB.
upload_chunk_size = 10485760

# Files on demand.
# 按需下载与目录部分填充：首次只列根直属项，第一次打开一个文件夹时才缓存
# 它的直属项；文件内容仍在真正读取时下载。已浏览目录可离线查看。没有配置
# 文件的图形界面首次运行默认启用；明确设为 false 则改用传统全量元数据同步。
on_demand = false

# Linux desktop indexers do not understand cloud placeholders. Keep them out
# by default so a background crawl cannot populate every partial directory.
exclude_desktop_indexer = true

# Storage-sense: when free space drops below this many bytes, files that are
# downloaded but not "always keep" are turned back into placeholders, least
# recently used first. 0 (the default) disables it.
auto_free_below_bytes = 0

# Transfer ceilings in bytes per second; 0 = unlimited.
download_limit_bytes_per_sec = 0
upload_limit_bytes_per_sec = 0

# 批量删除安全阀：静默窗口内的待删除批次累计超过 mass_delete_min，且占全账户
# 比例超过 mass_delete_fraction，则视为疑似误删（卸载的挂载点、错误的 bind、
# 误 rm），扣留全部删除并请用户确认，绝不直接在服务端删除。
# mass_delete_fraction = 1.0 关闭比例判定。
mass_delete_fraction = 0.5
mass_delete_min = 10
