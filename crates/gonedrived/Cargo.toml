[package]
name = "gonedrived"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GOnedrive background sync daemon"

[dependencies]
gonedrive-core.workspace = true
gonedrive-ipc.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
futures-util = "0.3"

clap = { version = "4", features = ["derive"] }
notify = "8"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "rustls-native-certs", "json", "form", "stream", "http2", "charset", "gzip"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
