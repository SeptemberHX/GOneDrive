[package]
name = "gonedrive-gtk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GOnedrive desktop front end"

[[bin]]
name = "gonedrive"
path = "src/main.rs"

[dependencies]
gonedrive-ipc.workspace = true

anyhow.workspace = true
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
async-channel = "2"
futures-util = "0.3"
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }
