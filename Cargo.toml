[workspace]
resolver = "2"
members = [
    "crates/gonedrive-core",
    "crates/gonedrive-ipc",
    "crates/gonedrive-hsm",
    "crates/gonedrived",
    "crates/gonedrive-gtk",
]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/monotune/GOnedrive"

[workspace.dependencies]
gonedrive-core = { path = "crates/gonedrive-core" }
gonedrive-ipc = { path = "crates/gonedrive-ipc" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "net", "signal", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "macros"] }
libc = "0.2.189"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
